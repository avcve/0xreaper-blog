<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}</title>
  <meta name="description" content="{{ page.excerpt | default: site.description | strip_html | truncate: 160 }}">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
</head>
<body>
  {% include sidebar.html %}
  <div class="page-body">
    <main class="feed">
      <div class="topbar">
        <span class="topbar-crumb">{{ page.title | default: "Home" }}</span>
        <input type="text" class="search" placeholder="grep --exploit" disabled title="Static site — wire up Lunr/Algolia for real search">
      </div>
      {{ content }}
    </main>
    {% include rightbar.html %}
  </div>
  <footer style="width:100%">
    &copy; {{ 'now' | date: "%Y" }} 0xReaper — built to break things, then explain how.
  </footer>
</body>
</html>
